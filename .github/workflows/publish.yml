name: Publish

on:
  release:
    types: [published]

jobs:
  # ─── Publish to npmjs.com ───
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: 'Pin workspace deps for npm publish (#151)'
        run: node scripts/pin-workspace-deps.mjs

      - name: 'Publish gate - no workspace/link leaks (#151)'
        run: node scripts/check-publish.mjs

      - name: Publish @plumpslabs/fennec-core
        run: |
          cd packages/core
          npm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @plumpslabs/fennec-cli
        run: |
          cd packages/cli
          npm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish to GitHub Packages ───
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Configure GPR scoped registry for pnpm
        run: |
          # pnpm config writes to ~/.npmrc (same file as setup-node), so pnpm reads it
          pnpm config set @plumpslabs:registry "https://npm.pkg.github.com"
        # Auth token is already configured by actions/setup-node@v4 with registry-url + NODE_AUTH_TOKEN

      - name: Publish @plumpslabs/fennec-core
        run: |
          cd packages/core
          pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @plumpslabs/fennec-cli
        run: |
          cd packages/cli
          pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Smoke test - fresh global install of latest (#151) ───
  smoke-test-install:
    needs: [publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # The registry needs time to propagate new metadata after publish
      # (v1.16.13's smoke test failed 6s after publish by resolving the
      # stale `latest`). Poll until the just-published version is visible.
      - name: Wait for registry propagation
        run: |
          WANT="${{ github.ref_name }}"
          WANT="${WANT#v}"
          for i in $(seq 1 30); do
            SEEN=$(npm view @plumpslabs/fennec-cli version 2>/dev/null || true)
            if [ "$SEEN" = "$WANT" ]; then
              echo "Registry shows $SEEN — proceeding."
              exit 0
            fi
            echo "Attempt $i: registry shows '${SEEN:-<none>}' (want $WANT) — waiting 20s…"
            sleep 20
          done
          echo "Timed out waiting for $WANT on the registry."
          exit 1

      - name: Install latest CLI globally from the registry
        run: npm install -g @plumpslabs/fennec-cli@latest

      - name: Verify the binary runs
        run: fennec --version
