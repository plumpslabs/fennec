name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm -r lint

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: pnpm --filter @plumpslabs/fennec-core exec playwright install chromium --with-deps
      - name: Install Playwright browsers (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: pnpm --filter @plumpslabs/fennec-core exec playwright install chromium
      - run: pnpm build
      # Split per package with a streaming reporter (#152): `pnpm -r` as a
      # single step swallows which package dies — on Windows the worker can
      # crash with zero output, so each package gets its own step, basic
      # (line-buffered) reporter, and a bounded worker pool.
      - name: Test core
        run: pnpm --filter @plumpslabs/fennec-core test -- --reporter=basic --no-color --silent=false --pool=forks --maxWorkers=2
      - name: Test cli
        run: pnpm --filter @plumpslabs/fennec-cli test -- --reporter=basic --no-color --silent=false --pool=forks --maxWorkers=2
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

  e2e:
    name: E2E (ubuntu, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Daemon/SIGKILL/supervisor suite — POSIX-only by design (#152).
      # Unit CI stays daemon-free; e2e runs here, alone, with output.
      - run: pnpm --filter @plumpslabs/fennec-cli test:e2e -- --reporter=basic --no-color

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify package artifacts
        shell: bash
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "✅ Checking $pkg"
              ls -la "$pkg/dist/" 2>/dev/null || echo "⚠️ No dist folder for $pkg"
            fi
          done
